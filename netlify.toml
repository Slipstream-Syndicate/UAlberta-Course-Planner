# Netlify deploy config.
#
# The site is a static React bundle plus data/courses.json -- no backend, no
# environment variables, no secrets. The build step does NOT run the scraper:
# data/courses.json is committed, so deploys never touch apps.ualberta.ca.
# Refreshing course data is a deliberate local action (re-run the scraper and
# the ETL, commit the result), not a side effect of pushing code.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: unknown paths fall back to index.html rather than 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The built page has no inline scripts or styles and no eval (checked against
# `vite build` output), so the policy can be strict: everything from this
# origin only. If a future change needs inline code, fix the change -- do not
# loosen this to 'unsafe-inline'.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
