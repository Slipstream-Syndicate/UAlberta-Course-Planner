# Netlify deploy config.
#
# The site is a static React bundle plus data/courses.json -- no backend, no
# environment variables, no secrets. The build step does NOT run the scraper:
# data/courses.json is committed, so deploys never touch apps.ualberta.ca.
# Refreshing course data is a deliberate local action (re-run the scraper and
# the ETL, commit the result), not a side effect of pushing code.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: unknown paths fall back to index.html rather than 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
