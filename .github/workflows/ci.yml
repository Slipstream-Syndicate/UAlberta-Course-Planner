name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Parser, scraper and dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Parser golden tests
        run: python parser/test_parser.py
      - name: Scraper tests (offline)
        run: python scraper/test_scraper.py
      # The deployed site ships data/courses.json as committed. If the parser
      # changed but the data was not regenerated (or the JSON was hand-edited),
      # the site would serve trees the current parser does not produce.
      - name: Committed courses.json matches the parser
        run: |
          python parser/build_courses.py > /dev/null
          git diff --exit-code --stat data/courses.json
      - name: Dataset integrity
        run: python parser/verify_all.py
      - name: Coverage audit (fails on any invented requirement)
        run: python parser/audit_coverage.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=moderate
